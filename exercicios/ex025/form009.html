<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario 009</title>
</head>
<body>
    <h1>Outras Operacoes com Formulario</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
   
    <p>
      <label for="inum">Numero:</label>  
      <input type="range" name="num" id="inum" min="0" max="10" value="S" oninput="ival.innerHTML = Number(inum.value)">
      <output id="ival">S</output>
    </p>


    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>
    </form>
    
</body>
</html>
